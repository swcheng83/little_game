    case 'rename': editingMe = true; render(); break;
    case 'focus': focusId = v; tab = 'explore'; spoil = false; render(); break;
    case 'cat': draft.k = v; render(); break;
    case 'stampNext': draft.sv = (draft.sv + 1 + Math.floor(Math.random() * (STYLE_N - 1))) % STYLE_N; render(); break;
    case 'leave': { var err = leaveRumor(); var el = document.getElementById('leaveErr'); if (err && el) el.textContent = err; break; }
    case 'reshare': q = S.left.filter(function (x) { return x.id === v; })[0]; if (q) { sheet = { kind: 'share', q: q }; render(); } break;
    case 'continue': draft.from = { chain: S.chains[+v].chain }; tab = 'leave'; render(); break;
    case 'paste': { var box = document.getElementById('pasteBox'), d = ingest(box.value), pe = document.getElementById('pasteErr'); if (d.err && pe) pe.textContent = d.err === 'unsafe' ? '這段內容被安全規則擋掉了。' : d.err; break; }
    case 'clip': navigator.clipboard.readText().then(function (txt) { if (!/D[QR]1\./.test(txt || '')) toast('剪貼簿裡沒有傳聞碼。'); else ingest(txt); }).catch(function () { toast('讀不到剪貼簿，請長按下面的框貼上。'); }); break;
    case 'share': navigator.share({ text: document.getElementById('shareFull').textContent }).catch(function () {}); break;
    case 'copy': { var txt2 = document.getElementById('shareFull').textContent; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt2).then(function () { toast('已複製'); }).catch(function () { toast('請長按上面的文字複製'); }); else toast('請長按上面的文字複製'); break; }
    case 'toReply': sheet = { kind: 'reply', q: sheet.q }; render(); break;
    case 'chainOn': { var s = sheet.q; draft = newDraft(s.k, { chain: (s.c || []).concat([s.f, S.me.name]) }); sheet = null; tab = 'leave'; render(); break; }
    case 'leaveHere': draft = newDraft(sheet.q.k); sheet = null; tab = 'leave'; render(); break;
    case 'close': sheet = null; render(); autoReveal(); break;
    case 'obCancel': editingMe = false; render(); break;
    case 'obDone': {
      var n = clean(document.getElementById('obName').value, 12), cr = clean(document.getElementById('obCrew').value, 12), oe = document.getElementById('obErr');
      if (!n) { oe.textContent = '取一個名字，朋友才知道是你。'; return; }
      if (unsafe(n)) { oe.textContent = '換個名字吧。'; return; }
      var first = !S.me; S.me = { name: n, crew: cr }; editingMe = false; save(); render();
      if (first && pendingHash) { ingest(pendingHash); pendingHash = null; }
      break;
    }
  }
});

readHash();
if (pendingSeed) { if (S.found[pendingSeed]) setTimeout(function () { toast('這則傳聞你已經找到了'); }, 300); else { focusId = pendingSeed; S.skipped[pendingSeed] = 0; delete S.skipped[pendingSeed]; } }
if (S.geoOk) startGeo(); else geo = 'ask';
render();
if (S.me && pendingHash) { ingest(pendingHash); pendingHash = null; }
if (!S.geoOk) {
  try { if (navigator.permissions && navigator.permissions.query) navigator.permissions.query({ name: 'geolocation' }).then(function (p) { if (p.state === 'granted') askGeo(); }).catch(function () {}); } catch (e) {}
}
})();
</script>
